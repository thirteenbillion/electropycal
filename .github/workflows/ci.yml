# Continuous checks for the published package. Three questions, one job each:
#
#   tests      does the suite pass on every supported Python, from a clean install of this tree?
#   published  does `pip install electropycal` from PyPI give a working package on Linux, Windows
#              and macOS, with the README quick start running end to end?
#   rebuild    on a release tag: does building this tree reproduce, byte for byte, the files
#              PyPI serves for that version?
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly, so a new release of a dependency that breaks the install shows up without a commit.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install this tree with the dev extras
        run: python -m pip install ".[dev]"
      - name: Record the resolved stack
        run: python -m pip list --format=freeze | grep -iE '^(electropycal|numpy|scipy|pandas|scikit-learn|pyarrow|joblib)='
      - name: Run the suite
        run: python -m pytest -q -p no:cacheprovider

  published:
    name: pip install electropycal, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # From PyPI, in an empty directory, so nothing from a checkout can leak in.
      - name: Install from PyPI
        run: python -m pip install --upgrade electropycal
      - name: The README quick start
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import electropycal; print('electropycal', electropycal.__version__)"
          electropycal --help
          electropycal extract --raw demo --out featureset.parquet
          electropycal discover --data featureset.parquet --profile fast
          RUN=$(ls -d outputs/model_discovery_* | head -1)
          electropycal freeze --run "$RUN" --data demo --out outputs/frozen_model
          ls outputs/frozen_model
          python -m electropycal features > /dev/null

  rebuild:
    name: rebuild matches PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build from the tag
        run: |
          python -m pip install build
          python -m build --outdir dist .
          sha256sum dist/*
      # The sdist must match PyPI byte for byte. A wheel's bytes also depend on the OS that
      # zipped it: Python's zipfile records the host in every entry's create_system field
      # (0 on Windows, 3 elsewhere), so a wheel built on one OS never hashes equal to the same
      # wheel built on another. A wheel therefore passes on an exact hash, or on identical
      # contents: the same entries in the same order, with the same bytes, modes, timestamps
      # and compression, differing in create_system alone. The log says which.
      - name: Compare with PyPI
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, sys, time, urllib.request, zipfile
          version = os.environ["TAG"].removeprefix("v")
          url = f"https://pypi.org/pypi/electropycal/{version}/json"
          for attempt in range(10):
              try:
                  served = {u["filename"]: (u["digests"]["sha256"], u["url"])
                            for u in json.load(urllib.request.urlopen(url, timeout=30))["urls"]}
                  break
              except Exception as e:
                  print(f"PyPI not ready ({e}); retrying")
                  time.sleep(30)
          else:
              sys.exit(f"electropycal {version} is not on PyPI")

          def entries(data):
              z = zipfile.ZipFile(io.BytesIO(data))
              return [(i.filename, z.read(i.filename), i.external_attr, i.date_time,
                       i.compress_type) for i in z.infolist()]

          built = {p.name: p.read_bytes() for p in pathlib.Path("dist").iterdir()}
          if set(built) != set(served):
              sys.exit(f"built {sorted(built)}, PyPI serves {sorted(served)}")
          ok = True
          for name, (digest, url) in sorted(served.items()):
              mine = built[name]
              if hashlib.sha256(mine).hexdigest() == digest:
                  print(f"MATCH            {name} {digest}")
                  continue
              if name.endswith(".whl"):
                  theirs = urllib.request.urlopen(url, timeout=60).read()
                  if hashlib.sha256(theirs).hexdigest() == digest and entries(mine) == entries(theirs):
                      print(f"CONTENT MATCH    {name}: identical entries, differing only in the "
                            f"zip create_system byte (PyPI's was built on another OS)")
                      continue
              print(f"MISMATCH         {name} {digest}")
              ok = False
          sys.exit(0 if ok else "the rebuild differs from PyPI")
          PY
